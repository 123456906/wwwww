# Mirror Tide - English bundle

# ============ Planet ============
planet.antichthon.name = Antichthon
planet.antichthon.description = The counter-earth. A crimson world scarred by mirror tides and hostile fungal filaments.

# ============ Items ============
item.mirror-tide-mirror-shard.name = Mirror Shard
