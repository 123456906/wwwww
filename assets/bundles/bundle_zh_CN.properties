# ============ 核心发射器 ============
block.mirror-tide-core-launcher-small.name = 小型核心发射器
block.mirror-tide-core-launcher-small.description = 每个区块只能建造一台。解锁向相邻 1 格区块发射核心，可发射 4x4 及以下的核心。
block.mirror-tide-core-launcher-medium.name = 中型核心发射器
block.mirror-tide-core-launcher-medium.description = 每个区块只能建造一台。可将核心发射到 2 格以内的区块，可发射 5x5 及以下的核心。
block.mirror-tide-core-launcher-large.name = 大型核心发射器
block.mirror-tide-core-launcher-large.description = 每个区块只能建造一台。可将核心发射到 3 格以内的区块，可发射 6x6 及以下的核心。
block.mirror-tide-core-launcher-final.name = 终极核心发射器
block.mirror-tide-core-launcher-final.description = 每个区块只能建造一台。可将任意核心发射到全球任意区块，可发射 7x7 及以下的核心。

